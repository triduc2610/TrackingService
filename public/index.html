<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tracking Service - Full Architecture Test</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="styles.css" rel="stylesheet">
</head>
<body>

    <div class="header">
        <h1>TRACKING SERVICE</h1>
        <span class="badge">Mã Đơn: DH-2026</span>
    </div>

    <div class="container">
        <div class="box">
            <h2>Trạng thái đơn hàng</h2>
            <button id="btnPlaceOrder" class="btn-order" onclick="placeOrder()">Khách hàng: Đặt đơn</button>
            <button id="btnStartDelivery" class="btn-delivery" onclick="startDelivery()" disabled>Tài xế: Giao hàng</button>
            <button id="btnCompleteOrder" class="btn-success" onclick="completeOrder()" disabled>Tài xế: Hoàn thành đơn hàng</button>
            
            <div id="driverLog" style="margin-top: 12px; font-size: 13px; font-weight: bold; color: #4a5568; text-align: center;">Chưa có đơn</div>
            <div class="status-log" id="customerLog">Bảng ghi log</div>

            <button id="btnFetchMongo" class="btn-mongo" onclick="fetchMongoData()" disabled>Lịch sử đơn hàng</button>
        </div>

        <div class="box box-map">
            <h2>Bản Đồ Khách Hàng</h2>
            <div id="map"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
